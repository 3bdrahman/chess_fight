# Railway Configuration for Chess Fight
# This enables persistent storage (PostgreSQL) for benchmark results and user data
# Deploy: Connect this repo to Railway, add PostgreSQL service, and deploy

[build]
builder = "nixpacks"
buildCommand = "pip install -e ."

[deploy]
startCommand = "streamlit run streamlit_app.py --server.port=$PORT --server.headless=true"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
# Database (auto-provided by Railway PostgreSQL)
# DATABASE_URL=${{Postgres.DATABASE_URL}}

# Python
PYTHON_VERSION = "3.11"

# Optional: Enable persistent benchmark storage
ENABLE_BENCHMARK_STORAGE = "true"

# ============================================================================
# Required: Add these as Railway Variables (Settings > Variables)
# ============================================================================
# OPENROUTER_API_KEY=sk-or-v1-...
# OPENAI_API_KEY=sk-...
# ANTHROPIC_API_KEY=sk-ant-...
# GOOGLE_API_KEY=...
# GROQ_API_KEY=gsk-...
# NIM_API_KEY=...