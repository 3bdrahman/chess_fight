# Frontier Models Benchmark Suite
# Compares the strongest available models across providers

name: "Frontier Models Comparison"
description: "Head-to-head tournament between top-tier proprietary models (GPT-4o, Claude 3.5 Sonnet, Gemini 1.5 Pro)"

benchmark:
  # Game rules
  time_control_seconds_per_move: 30
  opening_book: "eco_balanced"
  games_per_pairing: 10
  colors: "alternating"

  # Model params (deterministic for reproducibility)
  temperature: 0.0
  max_tokens: 2000
  seed: 42
  reasoning_level: "high"

  # Concurrency
  max_parallel_games: 4

  # Timeouts
  move_timeout_seconds: 120
  game_timeout_seconds: 7200

  # Players: provider:model_id
  players:
    - "openai:gpt-4o"
    - "anthropic:claude-3-5-sonnet-20241022"
    - "google:gemini-1.5-pro"
    - "openrouter:anthropic/claude-3.5-sonnet"

  # API keys loaded from environment
  api_keys: {}

  # Output
  output_dir: "runs"
  run_name: "frontier_models_2024"