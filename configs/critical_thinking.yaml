# Critical Thinking Stress Test Suite
# Focuses on positions requiring deep tactical/strategic reasoning

name: "Critical Thinking Stress Test"
description: "Evaluate models on complex positions: tactics, endgames, strategic maneuvering, time pressure"

benchmark:
  time_control_seconds_per_move: 60
  opening_book: "eco_balanced"
  games_per_pairing: 6
  colors: "alternating"

  temperature: 0.0
  max_tokens: 4000
  seed: 42
  reasoning_level: "high"

  max_parallel_games: 2

  move_timeout_seconds: 180
  game_timeout_seconds: 7200

  players:
    - "openai:gpt-4o"
    - "anthropic:claude-3-5-sonnet-20241022"
    - "google:gemini-1.5-pro"
    - "openrouter:anthropic/claude-3.5-sonnet"
    - "openai:o3-mini"
    - "anthropic:claude-3-7-sonnet-20250219"

  api_keys: {}

  output_dir: "runs"
  run_name: "critical_thinking_2024"

