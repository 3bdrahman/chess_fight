# Stockfish Calibration Suite
# Establishes ground-truth ELO baselines at different depths

name: "Stockfish Depth Calibration"
description: "Stockfish vs Stockfish at different depths to calibrate ELO-depth mapping"

benchmark:
  time_control_seconds_per_move: 5  # Fast for engine vs engine
  opening_book: "eco_balanced"
  games_per_pairing: 20
  colors: "alternating"

  temperature: 0.0
  max_tokens: 100
  seed: 42
  reasoning_level: "low"

  max_parallel_games: 8

  move_timeout_seconds: 30
  game_timeout_seconds: 3600

  players:
    - "stockfish:depth-8"
    - "stockfish:depth-10"
    - "stockfish:depth-12"
    - "stockfish:depth-14"
    - "stockfish:depth-16"
    - "stockfish:depth-18"
    - "stockfish:depth-20"

  api_keys: {}

  output_dir: "runs"
  run_name: "stockfish_calibration_2024"