# Budget Models Benchmark Suite
# Free tier / low-cost models for cost-effective evaluation

name: "Budget Models Comparison"
description: "Free and low-cost models via OpenRouter and Groq — evaluate without API spend"

benchmark:
  time_control_seconds_per_move: 30
  opening_book: "eco_balanced"
  games_per_pairing: 10
  colors: "alternating"

  temperature: 0.0
  max_tokens: 1000
  seed: 42
  reasoning_level: "mid"

  max_parallel_games: 4

  move_timeout_seconds: 120
  game_timeout_seconds: 7200

  players:
    # OpenRouter free tier
    - "openrouter:meta-llama/llama-3.1-8b-instruct:free"
    - "openrouter:mistralai/mistral-7b-instruct:free"
    - "openrouter:google/gemma-2-9b-it:free"
    - "openrouter:qwen/qwen-2.5-7b-instruct:free"
    # Groq free tier (fast)
    - "groq:llama-3.1-8b-instant"
    - "groq:gemma2-9b-it"
    - "groq:mixtral-8x7b-32768"

  api_keys: {}

  output_dir: "runs"
  run_name: "budget_models_2024"