# Streamlit Cloud Configuration for Chess Fight
# This config is used for both local development and Streamlit Cloud deployment

[server]
# Run in headless mode (required for cloud deployment)
headless = true

# Port (Streamlit Cloud sets PORT env var, but 8501 is default)
port = 8501

# CORS settings - allow embedding if needed
# For production, set to specific domains
enableCORS = false

# XSRF protection - disable for API access, enable for production with auth
enableXsrfProtection = false

# WebSocket settings for real-time updates
# maxMessageSize = 200  # MB, for large data transfers
# maxUploadSize = 200   # MB

# Address binding - 0.0.0.0 for cloud, localhost for local
# address = "0.0.0.0"

[browser]
# Disable usage stats collection
gatherUsageStats = false

# Server address for browser (auto-detected in cloud)
# serverAddress = "your-app.streamlit.app"

[theme]
# Chess Fight brand colors
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

# [theme]  # Alternative dark theme (uncomment to use)
# primaryColor = "#4a9eff"
# backgroundColor = "#0e1117"
# secondaryBackgroundColor = "#262730"
# textColor = "#fafafa"
# font = "sans serif"

[runner]
# Enable fast reruns for development
fastReruns = true

# Magic commands
magicEnabled = true

# Install tracer for performance profiling
installTracer = false

[logger]
# Log level: error, warning, info, debug
level = "info"

# Log format
# messageFormat = "%(asctime)s %(levelname)s %(message)s"

[global]
# Development mode (auto-set by Streamlit)
# developmentMode = false

# Sharing settings
# share = true

# [mapbox]
# token = ""  # Add Mapbox token if using maps

# [secrets]
# File-based secrets (not used in cloud - use dashboard instead)
# files = [".streamlit/secrets.toml"]