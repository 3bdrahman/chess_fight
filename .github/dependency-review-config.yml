# Dependency Review Configuration
# Used by actions/dependency-review-action to flag vulnerable or risky dependencies

# Severity thresholds
# Options: low, moderate, high, critical
fail-on-severity: moderate

# Allow specific vulnerabilities by GHSA ID (use sparingly)
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx

# Deny specific licenses
deny-licenses:
  - GPL-3.0-only
  - AGPL-3.0-only
  - SSPL-1.0

# Allow specific licenses (override deny)
# allow-licenses:
#   - MIT
#   - Apache-2.0
#   - BSD-3-Clause

# Block scopes
# deny-scopes:
#   - dev
#   - test

# Configuration for specific ecosystems
# ecosystems:
#   pip:
#     # Python-specific config
#     allow-malicious: false
#     allow-suspicious: false