name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run linting (ruff)
      run: ruff check .
    
    - name: Run type checking (mypy)
      run: mypy --config-file pyproject.toml .
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=chess_fight --cov=benchmark --cov=providers --cov=game --cov=ui --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install build dependencies
      run: pip install build
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t chess_fight:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm -d -p 8501:8501 --name chess_test chess_fight:latest
        sleep 10
        curl -f http://localhost:8501/_stcore/health || exit 1
        docker stop chess_test