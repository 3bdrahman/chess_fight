# Scheduled Benchmark - Runs weekly and on demand
name: Scheduled Benchmark

on:
  schedule:
    # Weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      config:
        description: 'Benchmark config to run'
        required: true
        type: choice
        options:
          - frontier_models
          - open_weights
          - reasoning_models
          - budget_models
          - critical_thinking
          - stockfish_calibration
        default: 'frontier_models'
      games_per_pairing:
        description: 'Games per pairing (override config)'
        required: false
        type: string
        default: ''
      parallel:
        description: 'Max parallel games (override config)'
        required: false
        type: string
        default: ''

env:
  PYTHON_VERSION: "3.11"
  CONFIG_DIR: "configs"

jobs:
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git hash in reproducibility

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Verify config exists
        run: |
          CONFIG="${{ github.event.inputs.config || 'frontier_models' }}"
          if [[ ! -f "${{ env.CONFIG_DIR }}/${CONFIG}.yaml" ]]; then
            echo "Config not found: ${{ env.CONFIG_DIR }}/${CONFIG}.yaml"
            exit 1
          fi

      - name: Run benchmark
        id: benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHESS_FIGHT_RUNS_ROOT: ${{ github.workspace }}/runs
        run: |
          CONFIG="${{ github.event.inputs.config || 'frontier_models' }}"
          GAMES="${{ github.event.inputs.games_per_pairing }}"
          PARALLEL="${{ github.event.inputs.parallel }}"

          CMD="chessbench suite --run ${CONFIG}"
          if [[ -n "${GAMES}" ]]; then
            CMD="${CMD} --games ${GAMES}"
          fi
          if [[ -n "${PARALLEL}" ]]; then
            CMD="${CMD} --parallel ${PARALLEL}"
          fi

          echo "Running: ${CMD}"
          ${CMD}

      - name: Find latest run directory
        id: find_run
        run: |
          LATEST=$(ls -td runs/*/ 2>/dev/null | head -1)
          if [[ -z "${LATEST}" ]]; then
            echo "No run directory found"
            exit 1
          fi
          echo "run_dir=${LATEST}" >> $GITHUB_OUTPUT

      - name: Generate HTML report
        run: |
          chessbench report "${{ steps.find_run.outputs.run_dir }}" --format html --output report.html

      - name: Generate JSON summary
        run: |
          chessbench report "${{ steps.find_run.outputs.run_dir }}" --format json --output summary.json

      - name: Verify reproducibility
        run: |
          chessbench verify "${{ steps.find_run.outputs.run_dir }}" --json || true

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.event.inputs.config || 'frontier_models' }}-${{ github.run_id }}
          path: |
            runs/
            report.html
            summary.json
          retention-days: 90

      - name: Print leaderboard
        run: |
          echo "=== LEADERBOARD ==="
          cat summary.json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for p in data.get('leaderboard', []):
              print(f\"  {p['player']}: {p.get('score_pct', 'N/A')}%\")
          "

  # ---------------------------------------------------------------------------
  # Deploy Report to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-report:
    name: Deploy Report to Pages
    needs: benchmark
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ github.event.inputs.config || 'frontier_models' }}-${{ github.run_id }}
          path: ./artifact

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare report directory
        run: |
          mkdir -p ./pages/benchmarks/${{ github.event.inputs.config || 'frontier_models' }}/${{ github.run_number }}
          cp ./artifact/report.html ./pages/benchmarks/${{ github.event.inputs.config || 'frontier_models' }}/${{ github.run_number }}/index.html
          cp ./artifact/summary.json ./pages/benchmarks/${{ github.event.inputs.config || 'frontier_models' }}/${{ github.run_number }}/summary.json

      - name: Create index page
        run: |
          cat > ./pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>ChessBench - LLM Benchmark Reports</title>
            <style>
              body { font-family: system-ui; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              h1 { color: #2c3e50; }
              .suite { margin: 1rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
              .suite h2 { margin-top: 0; }
              .run { display: inline-block; margin: 0.5rem; padding: 0.5rem 1rem; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
              .run:hover { background: #2980b9; }
            </style>
          </head>
          <body>
            <h1>🏆 ChessBench Benchmark Reports</h1>
            <p>Automated weekly LLM critical thinking benchmarks via chess.</p>
            <div class="suite">
              <h2>Frontier Models</h2>
              <a class="run" href="benchmarks/frontier_models/">Latest Run</a>
            </div>
            <div class="suite">
              <h2>Open Weights</h2>
              <a class="run" href="benchmarks/open_weights/">Latest Run</a>
            </div>
            <div class="suite">
              <h2>Reasoning Models</h2>
              <a class="run" href="benchmarks/reasoning_models/">Latest Run</a>
            </div>
            <div class="suite">
              <h2>Budget Models</h2>
              <a class="run" href="benchmarks/budget_models/">Latest Run</a>
            </div>
            <div class="suite">
              <h2>Critical Thinking</h2>
              <a class="run" href="benchmarks/critical_thinking/">Latest Run</a>
            </div>
            <div class="suite">
              <h2>Stockfish Calibration</h2>
              <a class="run" href="benchmarks/stockfish_calibration/">Latest Run</a>
            </div>
            <hr>
            <p><small>Generated by <a href="https://github.com/yourorg/chessbench">ChessBench</a> on ${{ github.run_id }}</small></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Notify (Slack/Discord/Email)
  # ---------------------------------------------------------------------------
  notify:
    name: Notify Completion
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ needs.benchmark.result }}"
          CONFIG="${{ github.event.inputs.config || 'frontier_models' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${STATUS}" == "success" ]]; then
            COLOR="good"
            TEXT="✅ Benchmark *${CONFIG}* completed successfully"
          else
            COLOR="danger"
            TEXT="❌ Benchmark *${CONFIG}* failed"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"attachments\":[{\"color\":\"${COLOR}\",\"text\":\"${TEXT}\",\"fields\":[{\"title\":\"Run\",\"value\":\"<${RUN_URL}|#${{ github.run_number }}>\",\"short\":true}]}]}" \
            "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}