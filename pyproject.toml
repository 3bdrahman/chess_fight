[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess_fight"
version = "0.1.0"
description = "AI Chess Benchmark - Provider-agnostic LLM chess evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "chess>=1.10.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=2.16.0",
    "ollama>=0.1.7",
    "httpx>=0.25.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "plotly>=5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.6",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RUF", # refurb
    "SIM", # flake8-simplify
    "TD",  # flake8-todo
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (allow for now)
    "T201",  # print statements (allowed for CLI)
    "S101",  # assert (allowed in tests)
    "S106",  # password in config (false positive for API keys)
    "S113",  # request without timeout (we use reasonable defaults)
]
per-file-ignores = { "tests/*" = ["S101", "S106", "S113"], "benchmark/*" = ["S101", "S106"] }
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    "build",
    "*.egg-info",
    "runs",
    ".streamlit",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true
namespace_packages = true
implicit_reexport = true
ignore_missing_imports = false

[tool.mypy.overrides]
module = [
    "google.*",
    "google_genai.*",
    "anthropic.*",
    "openai.*",
    "ollama.*",
    "streamlit.*",
    "chess.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=chess_fight",
    "--cov=benchmark",
    "--cov=providers",
    "--cov=game",
    "--cov=ui",
    "--cov-report=term-missing",
    "--cov-report=html",
]
filterwarnings = [
    "ignore::FutureWarning:providers/google.py",
    "ignore::DeprecationWarning:benchmark/logging.py",
]

[tool.coverage.run]
source = ["chess_fight", "benchmark", "providers", "game", "ui"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit]
fail_fast = true