# Render Configuration for Chess Fight
# This enables persistent storage (PostgreSQL) for benchmark results
# Deploy: Connect this repo to Render as a Web Service

# Build Command
buildCommand: "pip install -e ."

# Start Command
startCommand: "streamlit run streamlit_app.py --server.port=$PORT --server.headless=true"

# Environment Variables (set in Render Dashboard > Environment)
# DATABASE_URL: Auto-provided when you add a PostgreSQL database
# PYTHON_VERSION: "3.11"
# ENABLE_BENCHMARK_STORAGE: "true"

# Required API Keys (add in Render Dashboard > Environment)
# OPENROUTER_API_KEY=sk-or-v1-...
# OPENAI_API_KEY=sk-...
# ANTHROPIC_API_KEY=sk-ant-...
# GOOGLE_API_KEY=...
# GROQ_API_KEY=gsk-...
# NIM_API_KEY=...

# Health Check
healthCheckPath: "/_stcore/health"

# Auto-deploy
autoDeploy: true

# Instance Type (free tier available)
# instanceType: "free"

# Disk (for persistent storage if not using PostgreSQL)
# disk:
#   name: chess-data
#   mountPath: /data
#   sizeGB: 1