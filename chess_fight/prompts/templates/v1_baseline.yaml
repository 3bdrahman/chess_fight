version: "v1_baseline"
model_hints:
  description: "Original baseline prompt"
max_tokens: 2000
sections:
  - name: "role"
    content_template: "You are a professional chess engine playing as {color}."
    required: true
    priority: 0
  - name: "board_state"
    content_template: |
      [GAME STATE]
      FEN: {fen}
      Turn: {color}
    required: true
    priority: 1
  - name: "instructions"
    content_template: |
      [INSTRUCTIONS]
      Analyze the position and select the best move. Keep your reasoning concise (under 200 words).

      You must format your response EXACTLY like this:
      <think>
      (Your reasoning here)
      </think>
      <move>
      (Your chosen move in purely lower-case UCI notation, e.g. e2e4)
      </move>

      Failure to follow this exact format will result in disqualification.
    required: true
    priority: 0