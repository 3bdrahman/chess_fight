version: "v3_minimal"
model_hints:
  description: "Minimal prompt for fast models with SAN move hints"
max_tokens: 800
sections:
  - name: "role"
    content_template: "You are {color}. Respond with UCI move only."
    required: true
    priority: 0
    is_system: true
  - name: "board"
    content_template: |
      Position: {ascii_board}
      Last move: {last_move_san}
    required: true
    priority: 1
  - name: "legal_moves"
    content_template: |
      Legal (UCI with SAN): {legal_moves_annotated}
      Legal: {forcing_moves}
      {developing_moves}
      {positional_moves}
    required: true
    priority: 2
  - name: "instructions"
    content_template: "UCI move:"
    required: true
    priority: 0
    is_system: true